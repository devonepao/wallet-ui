<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wallet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1 class="header-title">Wallet</h1>
        <button class="header-btn" id="menuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="6" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="18" r="1.5" fill="currentColor"/>
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="cards-container" id="cardsContainer">
            <!-- Cards will be loaded dynamically from JSON -->
        </div>

    </main>

    <!-- Bottom Action Bar -->
    <div class="action-bar">
        <button class="action-btn">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M14 8V20M8 14H20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span>Add Card</span>
        </button>
        <button class="action-btn">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect x="6" y="10" width="16" height="12" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M10 10V8C10 5.79086 11.7909 4 14 4C16.2091 4 18 5.79086 18 8V10" stroke="currentColor" stroke-width="2"/>
                <circle cx="14" cy="16" r="1.5" fill="currentColor"/>
            </svg>
            <span>Secure</span>
        </button>
        <button class="action-btn">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M14 10V14L17 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>History</span>
        </button>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>

    <script src="script.js"></script>
</body>
</html>
